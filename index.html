<style>

@media (prefers-color-scheme:dark){:root{--ink:#e6f1ff;--mute:#9bb4d1;--glass:rgba(16,36,62,.58);--gb:rgba(120,170,230,.22);--line:rgba(120,170,230,.22);--a1:#5fb4ff;--a2:#3f8cf0;--a3:#8cc0ff;--bad:#ff8a80;--ok:#6fd49a;--warn:#f0b35a;--chip:rgba(95,180,255,.14);--bg1:#071427;--bg2:#0c2442;--bg3:#0a1a30;--sh:0 8px 32px rgba(0,0,0,.4);--cs:40%;--cl:26%;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.6 "Noto Sans Thai",system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden}

.o1{width:420px;height:420px;background:#7cc4ff;left:-80px;top:-60px}.o2{width:360px;height:360px;background:#3f8cf0;right:-60px;top:30%;animation-duration:30s}.o3{width:300px;height:300px;background:#a9d8ff;left:35%;bottom:-80px;animation-duration:27s}

h1,h2,h3{margin:0}.sub{color:var(--mute);margin:0}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a2);outline-offset:2px}

.btn.p{border:0;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));box-shadow:0 6px 18px rgba(30,111,224,.35)}

input[type=text],input[type=password],input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
label.f{display:block;font-weight:500;font-size:14px;margin-bottom:12px}label.f>input,label.f>select{margin-top:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--a1),var(--a3));display:grid;place-items:center;box-shadow:0 8px 20px rgba(30,111,224,.35)}
.logo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* login */

.lc{display:grid;grid-template-columns:1.1fr 1fr;width:100%;max-width:880px;overflow:hidden;padding:0}

.brand .logo{background:rgba(255,255,255,.2);box-shadow:none}.brand h1{font-size:30px;line-height:1.2}.brand p{margin:0;opacity:.9}
.brand ul{margin:6px 0 0;padding-left:18px;opacity:.92;font-size:14px}
.fm{padding:40px 34px;background:var(--glass)}.fm h2{font-size:22px;margin-bottom:4px}
.hint{margin-top:16px;padding:11px 14px;border-radius:12px;background:var(--chip);width:100%;text-align:left;border:1px dashed var(--a2);color:var(--ink)}
.hint small{display:block;color:var(--mute)}.err{min-height:22px;color:var(--bad);font-size:14px;margin:0 0 8px}
.shake{animation:sh .45s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media(max-width:700px){.lc{grid-template-columns:1fr}.brand{padding:24px}.brand ul{display:none}}
/* app */
.nav{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:20;margin:10px auto 0;max-width:1180px;width:calc(100% - 24px);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:99px}
.nav .logo{width:36px;height:36px;border-radius:11px}.nav .logo svg{width:20px;height:20px}

.tab[aria-current=page]{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}.tab:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:18px 12px calc(40px + env(safe-area-inset-bottom))}

.hero .logo{flex:none}.hero h2{font-size:26px}.card{padding:18px 20px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.cards div{padding:10px 14px;border-radius:14px;background:var(--chip);color:var(--mute);font-size:13px}.cards b{display:block;font-size:26px;color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.slot{padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:13px}.slot.ok{border-color:var(--ok)}.slot code{color:var(--a2)}
.tag{font-size:11px;border-radius:99px;padding:0 8px;background:var(--chip);color:var(--a2);margin-left:4px}
.drop{border:2px dashed var(--a1);border-radius:16px;padding:18px;text-align:center;background:var(--chip)}.drop.on{background:rgba(74,168,255,.3)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}small,.mut{color:var(--mute)}
.bar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .15s}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
.pv th,.pv td{border-bottom:1px solid var(--line);padding:5px 9px;font-size:13px;text-align:left;white-space:nowrap}.pv th{color:var(--mute);font-weight:500}
.tt{min-width:760px;table-layout:fixed}.tt th,.tt td{border:1px solid var(--line);padding:4px;vertical-align:top;font-size:13px}.tt th{background:var(--chip);font-weight:500}
th.t{width:92px;color:var(--mute);font-size:12px}.tt td{height:60px}td.brk{height:26px;text-align:center;color:var(--mute);font-size:12px;background:var(--chip)}
.cell{background:hsl(var(--h) var(--cs) var(--cl));border-radius:9px;padding:4px 7px;height:100%;line-height:1.3}.cell b{display:block;font-weight:600}.cell i{font-style:normal;color:var(--mute);font-size:12px;display:block}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-top:10px}.chk div{padding:8px 12px;border-radius:12px;background:var(--chip);font-size:14px}
.chk small{display:block}.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.seg button{border:0;background:none;color:var(--ink);padding:7px 16px}.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.banner{border-radius:14px;padding:12px 16px;border:1px solid var(--line);margin:10px 0}.banner.okb{border-color:var(--ok)}.banner.wb{border-color:var(--warn)}
.askbar{background:var(--chip);border-radius:12px;padding:10px 14px;margin:10px 0}
#toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{padding:10px 16px;border-radius:12px;max-width:320px;animation:ti .25s;border-left:4px solid var(--a2)}.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}@keyframes ti{from{opacity:0;transform:translateY(10px)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){.hero h2{font-size:21px}.nav{border-radius:20px}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<main id="login">
 <div class="glass lc" id="lcard">
  <section class="brand">
   <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8.5 15.5l2.5 2.5 4.5-5"/></svg></div>
   <h1>Tarang Reian</h1><p>ระบบจัดตารางเรียนอัตโนมัติ</p>
   <ul><li>นำเข้าข้อมูล CSV ได้ทั้ง 10 ไฟล์</li><li>จัดตารางพร้อมตรวจเงื่อนไข 12 ข้อ</li><li>ส่งออกเป็น CSV และรูปภาพ</li></ul>
  </section>
  <section class="fm">
   <h2>เข้าสู่ระบบ</h2><p class="sub" style="margin-bottom:18px">กรอกข้อมูลเพื่อเริ่มใช้งาน</p>
   <label class="f">ชื่อผู้ใช้<input id="user" type="text" autocomplete="username" autocapitalize="none"></label>
   <label class="f">รหัสผ่าน<input id="pass" type="password" autocomplete="current-password"></label>

   <button class="btn p" style="width:100%" id="go" type="button">เข้าสู่ระบบ</button>
   <button class="hint" id="fill" type="button"><b>แตะเพื่อกรอกอัตโนมัติ</b><small>ชื่อผู้ใช้ admin · รหัสผ่าน 12345</small></button>
  </section>
 </div>
</main>
<div id="app" hidden>
 <nav class="nav glass" aria-label="เมนูหลัก">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8.5 15.5l2.5 2.5 4.5-5"/></svg></div>
  <b class="gt" style="font-size:17px">Tarang Reian</b>
  <div class="tabs" id="tabs"></div>

 </nav>
 <div class="wrap" id="pg"></div>
</div>

<script type="text/plain" id="core">
function rng(s){s=s>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var DAYN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'];
var CNAME=['คณิตศาสตร์','ภาษาไทย','ภาษาอังกฤษ','วิทยาศาสตร์','สังคมศึกษา','พลศึกษา','ศิลปะ','คอมพิวเตอร์'];
var TNAME=['สมชาย','สมหญิง','วิชัย','นภา','ประเสริฐ','ศิริพร','อนุชา','กัลยา','ธีรพงษ์','มาลี','สุรชัย','จินตนา','พิชิต','อรุณี','ณรงค์','วรรณา','ชัยวัฒน์','รัตนา','สมศักดิ์','พรทิพย์'];
/* ---------- ข้อมูลตัวอย่าง: n กลุ่ม ---------- */
function gen(n){var P=function(p,i,w){return p+String(i+1).padStart(w||3,'0')},T={groups:[],teachers:[],rooms:[],courses:[],offerings:[],timeslots:[],blocked_slots:[],fixed_sessions:[],students:[],enrollments:[]};
 var spec=[[0,2,1],[1,2,1],[2,2,1],[3,1,3],[4,1,2],[5,1,2],[6,1,1],[7,1,2]],pool=Math.ceil(n/4),lab=[0,0,0,1,0,0,0,1];
 for(var i=0;i<n;i++)T.groups.push({group_id:P('G',i,2),name:'ม.'+(1+Math.floor(i/4))+'/'+(1+i%4),size:28+(i*7)%9});
 CNAME.forEach(function(c,i){T.courses.push({course_id:P('C',i,2),name:c,room_type:lab[i]?'lab':'normal'})});
 var tn=0;for(var c=0;c<8;c++)for(var k=0;k<pool;k++){T.teachers.push({teacher_id:P('T',tn),name:'ครู'+TNAME[tn%20]+(tn>=20?' '+(1+Math.floor(tn/20)):''),max_periods:24});tn++}
 var nn=Math.max(3,Math.ceil(n/2)+2),nl=Math.max(2,Math.ceil(n/4));
 for(i=0;i<nn;i++)T.rooms.push({room_id:P('R',i),name:'ห้อง '+(101+i),capacity:40,type:'normal'});
 for(i=0;i<nl;i++)T.rooms.push({room_id:P('R',nn+i),name:'ห้องปฏิบัติการ '+(i+1),capacity:40,type:'lab'});
 var tm=[['08:30','09:20','class'],['09:20','10:10','class'],['10:10','11:00','class'],['11:00','11:50','class'],['11:50','12:50','lunch'],['12:50','13:40','class'],['13:40','14:30','class'],['14:30','15:20','class'],['15:20','16:10','class']];
 tm.forEach(function(x,i){T.timeslots.push({slot_id:i+1,start:x[0],end:x[1],type:x[2]})});
 var oid=0,pe={},fx=0,ctr={},nfix=Math.max(2,Math.floor(n*0.75)),sid=0;
 for(var g=0;g<n;g++){var gs=T.groups[g].size;
  for(var j=0;j<spec.length;j++){var sp=spec[j],tid=T.teachers[sp[0]*pool+(g%pool)].teacher_id,o=P('O',oid++);
   T.offerings.push({offering_id:o,group_id:T.groups[g].group_id,course_id:P('C',sp[0],2),teacher_id:tid,sessions_per_week:sp[1],block_len:sp[2]});
   if(sp[0]==5&&g<nfix){var cnt=ctr[tid]||0;ctr[tid]=cnt+1;T.fixed_sessions.push({offering_id:o,session_no:1,day:[1,2,4,5][cnt%4],start_slot:6,room_id:g==0?P('R',0):''})}
   if(sp[0]==0&&g==0)T.fixed_sessions.push({offering_id:o,session_no:1,day:1,start_slot:1,room_id:''});
   pe[g+'|'+j]=o}
  for(var s=0;s<gs;s++){var st=P('S',sid++,4);T.students.push({student_id:st,name:'นักเรียน '+(sid),group_id:T.groups[g].group_id});for(j=0;j<spec.length;j++)T.enrollments.push({student_id:st,offering_id:pe[g+'|'+j]})}}
 T.teachers.forEach(function(t,i){if(i%4==1)for(var s=6;s<=9;s++)T.blocked_slots.push({owner_type:'teacher',owner_id:t.teacher_id,day:3,slot_id:s,reason:'ประชุมกลุ่มสาระ'})});
 for(s=1;s<=2;s++)T.blocked_slots.push({owner_type:'room',owner_id:T.rooms[nn].room_id,day:5,slot_id:s,reason:'ซ่อมบำรุง'});
 T.blocked_slots.push({owner_type:'group',owner_id:T.groups[0].group_id,day:5,slot_id:9,reason:'กิจกรรมชุมนุม'});
 return T}
/* ---------- สร้างโมเดลและตรวจข้อมูล ---------- */
function prep(T){var E=[],W=[],G=function(k){return T[k]||[]},num=function(v){v=String(v==null?'':v).trim();return v!==''&&isFinite(v)?+v:NaN};
 ['groups','teachers','rooms','courses','offerings','timeslots'].forEach(function(k){if(!G(k).length)E.push('ยังไม่มีไฟล์ '+k+'.csv')});if(E.length)return{E:E,W:W};
 var M={slots:[],sIdx:{},g:{},gl:[],t:{},tl:[],r:{},rooms:[],c:{},off:{},offs:[],ses:[],bl:{teacher:{},room:{},group:{}},fix:{},days:5,nStu:G('students').length,fixN:0};
 function ids(k,key,fn){var seen={};G(k).forEach(function(r,i){var id=String(r[key]||'').trim();if(!id)return E.push(k+'.csv แถว '+(i+2)+': ไม่มี '+key+' → ใส่รหัสให้ครบ');if(seen[id])return E.push(k+'.csv: '+key+' '+id+' ซ้ำ → ทำให้รหัสไม่ซ้ำกัน');seen[id]=1;fn(id,r,i)})}
 G('timeslots').forEach(function(r,i){var id=num(r.slot_id);if(!(id>0))E.push('timeslots.csv แถว '+(i+2)+': slot_id ต้องเป็นตัวเลข');else M.slots.push({id:id,start:r.start,end:r.end,lunch:/พัก|lunch/i.test(r.type)})});
 M.slots.sort(function(a,b){return a.id-b.id});M.slots.forEach(function(s,i){M.sIdx[s.id]=i});
 var run=0,mx=0;M.slots.forEach(function(s){run=s.lunch?0:run+1;mx=Math.max(mx,run)});M.maxRun=mx;
 ids('groups','group_id',function(id,r,i){var z=num(r.size);if(!(z>0))E.push('groups.csv แถว '+(i+2)+': size ต้องเป็นตัวเลขมากกว่า 0');M.g[id]={id:id,n:r.name,size:z};M.gl.push(M.g[id])});
 ids('teachers','teacher_id',function(id,r,i){var z=num(r.max_periods);if(!(z>0))E.push('teachers.csv แถว '+(i+2)+': max_periods ต้องเป็นตัวเลขมากกว่า 0');M.t[id]={id:id,n:r.name,max:z};M.tl.push(M.t[id])});
 ids('rooms','room_id',function(id,r,i){var z=num(r.capacity);if(!(z>0))E.push('rooms.csv แถว '+(i+2)+': capacity ต้องเป็นตัวเลขมากกว่า 0');M.r[id]=M.rooms.length;M.rooms.push({id:id,n:r.name,cap:z,lab:/lab|ปฏิบัติ/i.test(r.type)?1:0})});
 ids('courses','course_id',function(id,r){M.c[id]={id:id,n:r.name,lab:/lab|ปฏิบัติ/i.test(r.room_type)?1:0,i:Object.keys(M.c).length}});
 var cnt={};G('enrollments').forEach(function(r,i){cnt[r.offering_id]=(cnt[r.offering_id]||0)+1});
 G('students').forEach(function(r,i){if(!M.g[r.group_id])E.push('students.csv แถว '+(i+2)+': ไม่พบกลุ่ม '+r.group_id)});
 ids('offerings','offering_id',function(id,r,i){var g=M.g[r.group_id],c=M.c[r.course_id],t=M.t[r.teacher_id],s=num(r.sessions_per_week),L=num(r.block_len||1);
  if(!g||!c||!t)return E.push('offerings.csv แถว '+(i+2)+' ('+id+'): ไม่พบรหัสกลุ่ม วิชา หรือครู ('+r.group_id+', '+r.course_id+', '+r.teacher_id+') → ตรวจรหัสให้ตรงกับไฟล์อื่น');

function p4(){$('pg').innerHTML=hero(IC4,'ส่งออก','ดาวน์โหลดผลลัพธ์เป็น CSV หรือรูป PNG ของแต่ละกลุ่ม')+'<div class="glass card"><div class="row"><button class="btn p" onclick="expSol()">ดาวน์โหลด solution.csv</button><button class="btn" onclick="expAll()">ตารางทั้งหมด CSV</button></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><b>รูป PNG ตารางรายกลุ่ม</b><div class="row" style="margin-top:8px"><select id="pgs" style="width:auto">'+M.gl.map(g=>'<option value="'+g.id+'">'+g.n+'</option>').join('')+'</select><button class="btn" onclick="expPng(false)">ดาวน์โหลด PNG กลุ่มที่เลือก</button><button class="btn" onclick="expPng(true)">PNG ทุกกลุ่ม ('+M.gl.length+' ไฟล์)</button></div><p class="mut" style="font-size:13px;margin-top:12px">หากกดแล้วไม่มีไฟล์ขึ้น เบราว์เซอร์หรือหน้าพรีวิวอาจบล็อกการดาวน์โหลด ให้เปิดไฟล์ index.html โดยตรง</p></div>'}
function expSol(){dl('solution.csv',toCSV(['offering_id','session_no','day','period','room_id','teacher_id','group_id'],res.rows));toast('เริ่มดาวน์โหลด solution.csv','ok')}
function expAll(){const rs=res.rows.map(r=>{const o=M.off[r.offering_id],s=M.slots[M.sIdx[r.period]];return{'กลุ่มเรียน':M.g[o.g].n,'วัน':DAYN[r.day-1],'_d':+r.day,'คาบ':r.period,'เวลา':s.start+'-'+s.end,'วิชา':M.c[o.c].n,'ครู':M.t[o.t].n,'ห้อง':M.rooms[M.r[r.room_id]].n}});
 rs.sort((a,b)=>a['กลุ่มเรียน']<b['กลุ่มเรียน']?-1:a['กลุ่มเรียน']>b['กลุ่มเรียน']?1:a._d-b._d||a['คาบ']-b['คาบ']);dl('timetable-all.csv',toCSV(['กลุ่มเรียน','วัน','คาบ','เวลา','วิชา','ครู','ห้อง'],rs));toast('เริ่มดาวน์โหลด timetable-all.csv','ok')}
async function drawPng(gid){try{await document.fonts.load('600 20px "Noto Sans Thai"')}catch(e){}
 const g=M.g[gid],W=1240,lw=130,cw=(W-lw-24)/5,rh=76,top=100;let H=top+44+24;M.slots.forEach(s=>H+=s.lunch?34:rh);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),F=(w,s)=>w+' '+s+'px "Noto Sans Thai",sans-serif';
 const gr=x.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#e9f5ff');gr.addColorStop(1,'#cfe6ff');x.fillStyle=gr;x.fillRect(0,0,W,H);
 x.fillStyle='#0a49b3';x.font=F(700,32);x.fillText('ตารางเรียน '+g.n,24,48);x.fillStyle='#4f6b8a';x.font=F(400,16);x.fillText('Tarang Reian · '+g.size+' คน',24,76);
 const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};let y=top;x.font=F(600,16);
 DAYN.forEach((d,i)=>{x.fillStyle='#1e6fe0';rr(lw+12+i*cw+3,y,cw-6,36,10);x.fill();x.fillStyle='#fff';x.textAlign='center';x.fillText(d,lw+12+i*cw+cw/2,y+24)});x.textAlign='left';y+=44;
 const by={};res.rows.forEach(r=>{if(r.group_id==gid)by[(r.day-1)+'|'+M.sIdx[r.period]]=r});
 M.slots.forEach((s,si)=>{if(s.lunch){x.fillStyle='rgba(30,111,224,.12)';rr(12,y,W-24,28,8);x.fill();x.fillStyle='#4f6b8a';x.font=F(400,14);x.textAlign='center';x.fillText('พักเที่ยง '+s.start+'–'+s.end,W/2,y+19);x.textAlign='left';y+=34;return}
  x.fillStyle='#4f6b8a';x.font=F(500,14);x.fillText('คาบ '+s.id,18,y+28);x.font=F(400,13);x.fillText(s.start+'–'+s.end,18,y+48);
  for(let d=0;d<5;d++){const r=by[d+'|'+si],px=lw+12+d*cw+3;x.fillStyle='rgba(255,255,255,.6)';rr(px,y,cw-6,rh-6,10);x.fill();if(!r)continue;const o=M.off[r.offering_id];x.fillStyle='hsl('+hue(o.id)+',70%,84%)';rr(px,y,cw-6,rh-6,10);x.fill();
   x.fillStyle='#0b2545';x.font=F(600,16);x.fillText(M.c[o.c].n,px+10,y+26,cw-26);x.fillStyle='#35506f';x.font=F(400,13);x.fillText(M.t[o.t].n,px+10,y+44,cw-26);x.fillText(M.rooms[M.r[r.room_id]].n,px+10,y+60,cw-26)}y+=rh});
 return new Promise(r=>c.toBlob(r,'image/png'))}
async function expPng(all){const L=all?M.gl.map(g=>g.id):[$('pgs').value];toast('กำลังสร้างรูป '+L.length+' ไฟล์…');for(const id of L){const b=await drawPng(id);dl('timetable-'+M.g[id].n.replace(/[^\wก-๙]+/g,'_')+'.png',b);await new Promise(r=>setTimeout(r,250))}toast('สร้างรูปเสร็จแล้ว','ok')}
/* ---------- หน้า 5 ตรวจสอบ ---------- */
let up=null,tests=null;
function p5(){$('pg').innerHTML=hero(IC5,'ตรวจสอบ','อัปโหลด solution.csv จาก AI อื่น แล้วตรวจด้วยตัวตรวจเดียวกัน หรือรันทดสอบ 3 ขนาด')+
 '<div class="glass card"><b>ตรวจ solution.csv</b><p class="mut" style="margin:4px 0 10px;font-size:14px">คอลัมน์ที่ต้องมี: offering_id, session_no, day (1-5), period (slot_id), room_id · ตรวจเทียบกับข้อมูลที่นำเข้าในขั้นที่ 1</p>'+
 (ready()?'<input type="file" id="sf" accept=".csv,text/csv"><div id="cmp"></div>':'<p class="bad">ต้องนำเข้าข้อมูลที่ถูกต้องในขั้นที่ 1 ก่อน จึงจะตรวจได้</p>')+'</div>'+
 '<div class="glass card"><b>รันทดสอบ 3 ขนาด</b><p class="mut" style="margin:4px 0 10px;font-size:14px">สร้างข้อมูลตัวอย่างเล็ก 2 / กลาง 8 / ใหญ่ 20 กลุ่ม จัดตาราง แล้วตรวจ 12 ข้อ (Seed 2024)</p><button class="btn p" id="tbtn" onclick="runTests()">เริ่มทดสอบ</button><div id="tres" style="margin-top:12px"></div></div>';
 if(ready()){$('sf').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const p=parseCSV(String(rd.result));const need=['offering_id','session_no','day','period','room_id'].filter(h=>!p.h.includes(h));
   if(need.length){up=null;$('cmp').innerHTML='<p class="bad">ไฟล์นี้ขาดคอลัมน์: '+need.join(', ')+'</p>';return toast('รูปแบบไฟล์ไม่ถูกต้อง','bad')}
   up={name:f.name,rows:p.rows.length,chk:C.check(M,p.rows)};cmp();toast('ตรวจ '+f.name+' แล้ว','ok')};rd.readAsText(f,'UTF-8')};cmp()}
 drawTests()}
function cmp(){if(!up||!$('cmp'))return;const a=res?res.chk:null,b=up.chk,pa=a?a.filter(x=>x.ok).length:0,pb=b.filter(x=>x.ok).length,cell=x=>x?'<span class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'✓ ผ่าน':'✗ '+x.c+' จุด')+'</span>':'<span class="mut">ยังไม่ได้จัด</span>';
 $('cmp').innerHTML='<p style="margin:12px 0 4px"><b>'+up.name+'</b> · '+up.rows+' แถว · ผ่าน <b class="'+(pb==12?'ok':'bad')+'">'+pb+'/12</b>'+(a?' · ตัวจัดตารางนี้ผ่าน '+pa+'/12':'')+'</p>'+tb(['เงื่อนไข','ตัวจัดตารางนี้','ไฟล์ที่อัปโหลด'],C.CHECKS.map((n,i)=>({'เงื่อนไข':(i+1)+'. '+n,'ตัวจัดตารางนี้':cell(a&&a[i]),'ไฟล์ที่อัปโหลด':cell(b[i])})))+
 b.filter(x=>!x.ok).map(x=>'<div class="bad" style="font-size:13px;margin-top:6px"><b>'+x.n+'</b>'+x.m.map(t=>'<br>'+t).join('')+'</div>').join('')}
async function runTests(){$('tbtn').disabled=true;tests=[];for(const n of [2,8,20]){drawTests(n);const Tt=C.gen(n),P=C.prep(Tt),t0=performance.now(),m=await solveP(Tt,2024);const ms=performance.now()-t0,chk=C.check(P.M,m.rows);tests.push({n,ses:m.total,placed:m.total-m.un.length,at:m.attempts,ms,pass:chk.filter(x=>x.ok).length})}
 $('tbtn').disabled=false;drawTests();const all=tests.every(t=>t.pass==12&&t.placed==t.ses);toast(all?'ทดสอบผ่านครบ 12 ข้อทั้ง 3 ขนาด':'มีบางขนาดที่ยังไม่ผ่านครบ',all?'ok':'warn');if(all)confetti()}
function drawTests(run){const e=$('tres');if(!e||!tests)return;e.innerHTML=tb(['ขนาด','ครั้งเรียน','วางได้','รอบ','เวลา','ผ่านเงื่อนไข'],tests.map(t=>({'ขนาด':t.n+' กลุ่ม','ครั้งเรียน':t.ses,'วางได้':t.placed+'/'+t.ses,'รอบ':t.at,'เวลา':t.ms<1000?Math.round(t.ms)+' ms':(t.ms/1000).toFixed(2)+' วินาที','ผ่านเงื่อนไข':'<span class="'+(t.pass==12?'ok':'bad')+'">'+t.pass+'/12</span>'})))+(run?'<p class="mut">กำลังทดสอบขนาด '+run+' กลุ่ม…</p>':'')}
if(sget('tr_user'))enter();
</script>
